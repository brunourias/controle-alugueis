name: Verificação de integridade

on:
  push:
    branches: [main]
  pull_request:

# Em publicações com mais de um arquivo, mantém somente a verificação da versão final.
concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Aguarda a publicação consolidar
        if: github.event_name == 'push'
        run: sleep 15
      - uses: actions/checkout@v5
      - name: Usa a versão final publicada
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git checkout origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/integrity.mjs
